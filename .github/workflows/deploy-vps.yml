name: Deploy VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Pull, build, and restart on VPS
    runs-on: ubuntu-latest

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH || '/var/www/hoaportal' }}

    steps:
      - name: Prepare SSH key
        run: |
          set -e

          if [ -z "$VPS_HOST" ]; then
            echo "Missing GitHub secret: VPS_HOST"
            exit 1
          fi
          if [ -z "$VPS_USER" ]; then
            echo "Missing GitHub secret: VPS_USER"
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "Missing GitHub secret: VPS_SSH_KEY"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/hoaportal_deploy_key
          sed -i 's/\r$//' ~/.ssh/hoaportal_deploy_key
          chmod 600 ~/.ssh/hoaportal_deploy_key

          echo "Checking SSH host key for $VPS_USER@$VPS_HOST:$VPS_PORT"
          ssh-keyscan -T 30 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy latest main branch
        run: |
          ssh -i ~/.ssh/hoaportal_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "APP_PATH='$VPS_APP_PATH' bash -s" <<'EOF'
          set -e

          cd "$APP_PATH"
          git pull --ff-only origin main

          cd backend
          npm ci
          npm run build
          pm2 restart hoaportal-api --update-env
          pm2 save

          cd ../frontend
          npm ci
          npm run build

          nginx -t
          systemctl reload nginx
          EOF
